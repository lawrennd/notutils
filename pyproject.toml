[project]
name = "notutils"
version = "0.0.1"
description = "Notebook utilities."
authors = [
    { name = "Neil D. Lawrence", email = "lawrennd@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "IPython",
    "ipywidgets",
    "numpy",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/lawrennd/notutils"
Repository = "https://github.com/lawrennd/notutils"

[dependency-groups]
dev = [
    "pytest>=7.0.0,<8",
    "pytest-cov>=4.0.0,<5",
    "pytest-mock>=3.10.0,<4",
    "pytest-benchmark>=4.0.0,<5",
    "hypothesis>=6.0.0,<7",
    "mypy>=1.0.0,<2",
    "black>=23.0.0,<24",
    "flake8>=6.0.0,<7",
    "sphinx>=6.0.0,<7",
    "sphinx-rtd-theme>=1.3.0,<2",
    "sphinx-autodoc-typehints>=1.23.0,<2",
    "myst-parser>=2.0.0,<3",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notutils"]

[tool.hatch.build.targets.sdist]
include = [
    "/notutils",
    "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["notutils/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=notutils",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

[tool.coverage.run]
source = ["notutils"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
